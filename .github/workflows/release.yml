name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/static let version = \".*\"/static let version = \"$VERSION\"/" Sources/xkeys/Constants.swift
          plutil -replace CFBundleVersion -string "$VERSION" Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" Info.plist

      - name: Run the pure-logic checks
        run: |
          xcrun --sdk macosx swiftc -O \
            Sources/xkeys/Config.swift \
            Sources/xkeys/KeyNames.swift \
            Sources/xkeys/HIDKeyTable.swift \
            Sources/xkeys/Chord.swift \
            Sources/xkeys/HIDMapping.swift \
            Sources/xkeys/Log.swift \
            Sources/xkeys/Constants.swift \
            Checks/main.swift \
            -o /tmp/checks
          /tmp/checks

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      # Ad-hoc, because there is no Developer ID certificate for this project.
      # Two consequences, both stated in the release notes below: the download
      # is quarantined by Gatekeeper, and the signature changes every release,
      # so macOS treats each version as a new app and asks for Accessibility
      # and Input Monitoring again. Building from source with a stable local
      # identity avoids both.
      - name: Create and sign app bundle
        run: |
          mkdir -p xkeys.app/Contents/MacOS xkeys.app/Contents/Resources
          cp .build/apple/Products/Release/xkeys xkeys.app/Contents/MacOS/
          cp Info.plist xkeys.app/Contents/
          cp AppIcon.icns xkeys.app/Contents/Resources/
          codesign -f -s - --identifier com.xieyt.xkeys xkeys.app

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent xkeys.app xkeys.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: xkeys.zip
          generate_release_notes: true
          body: |
            Download, unzip, and move `xkeys.app` to `/Applications`.

            This build is ad-hoc signed, which costs you two things:

            - macOS quarantines it. Clear that with
              `xattr -dr com.apple.quarantine /Applications/xkeys.app`, or
              right-click the app and choose Open the first time.
            - The signature changes every release, so each update asks for
              Accessibility and Input Monitoring again.

            Building from source avoids both: `just setup-signing-cert` makes
            one stable local identity, and the permission grants then survive
            every rebuild.
